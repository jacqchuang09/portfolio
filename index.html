<meta charset="utf-8">
<title>Jacqueline Chuang ✿</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<style>
  /* ---------- palette: sun-bleached tropical ---------- */
  :root{
    --cream:#F3EEE4; --cream-2:#EDE6D8; --paper:#FCFAF4;
    --ink:#2C2620; --ink-soft:#7A6E62;
    --orange:#F49306; --orange-2:#F27305; --red:#F13D09; --red-2:#E63A26;
    --pink:#EE6A92; --pink-lt:#F5CAE8; --coral:#E0858E;
    --teal:#6DB8BE; --lime:#A5BB1A; --sage:#9EC6AA; --mustard:#C9B749;
    --line:#2C2620; --dot:rgba(44,38,32,.10); --shadow:rgba(44,38,32,.18);
    --font-hand:"Chalkboard SE","Comic Sans MS","Marker Felt","Comic Neue",ui-rounded,"Segoe UI",system-ui,sans-serif;
    --font-body:ui-rounded,"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
    --font-type:"Courier New",ui-monospace,"SFMono-Regular",monospace;
  }
  :root[data-theme="dark"]{
    --cream:#241F1A; --cream-2:#2B251F; --paper:#332C25;
    --ink:#F3EEE4; --ink-soft:#B9AC9C; --line:#F3EEE4;
    --dot:rgba(243,238,228,.10); --shadow:rgba(0,0,0,.45);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --cream:#241F1A; --cream-2:#2B251F; --paper:#332C25;
      --ink:#F3EEE4; --ink-soft:#B9AC9C; --line:#F3EEE4;
      --dot:rgba(243,238,228,.10); --shadow:rgba(0,0,0,.45);
    }
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{font-family:var(--font-body);color:var(--ink);background:var(--cream);
    -webkit-font-smoothing:antialiased;touch-action:none}

  #stage{position:fixed;inset:0;overflow:hidden;cursor:grab;background:var(--cream)}
  #stage.grabbing{cursor:grabbing}
  #board{position:absolute;left:0;top:0;width:6100px;height:6150px;transform-origin:0 0;
    background-image:radial-gradient(var(--dot) 1.6px,transparent 1.6px);
    background-size:34px 34px;will-change:transform}
  #board.flying{transition:transform .85s cubic-bezier(.22,.61,.36,1)}

  .node{position:absolute;transform:translate(-50%,-50%)}
  .node .tilt{transform:rotate(var(--r,0deg))}
  .draggable{cursor:grab}
  .draggable.dragging{cursor:grabbing;z-index:60!important}

  .card{background:var(--paper);border:2.5px solid var(--line);
    border-radius:255px 15px 225px 15px/15px 225px 15px 255px;
    box-shadow:6px 7px 0 var(--shadow);padding:22px 24px;max-width:340px}
  .tape{position:absolute;top:-15px;left:50%;translate:-50% 0;width:96px;height:30px;
    background:var(--tape,var(--teal));opacity:.72;border-radius:3px;
    box-shadow:0 2px 4px var(--shadow);rotate:-4deg}
  .tape::after{content:"";position:absolute;inset:0;background:
     repeating-linear-gradient(90deg,rgba(255,255,255,.25) 0 6px,transparent 6px 12px)}

  .eyebrow{font-family:var(--font-hand);font-size:.8rem;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink-soft);margin:0 0 6px}
  h1,h2,h3{font-family:var(--font-hand);margin:0;line-height:1.05;text-wrap:balance}

  .hero{max-width:520px;text-align:left}
  .hero h1{font-size:clamp(2.2rem,4.2vw,3.4rem)}
  .hero .wave{display:inline-block;transform-origin:70% 70%;animation:wave 2.6s ease-in-out infinite}
  @keyframes wave{0%,60%,100%{rotate:0deg}70%{rotate:16deg}80%{rotate:-8deg}90%{rotate:12deg}}
  .type-line{font-family:var(--font-type);font-size:clamp(1.05rem,2.3vw,1.45rem);
    color:var(--red-2);margin:10px 0 0;font-weight:700;min-height:1.6em}
  .type-line .caret{display:inline-block;width:.6ch;color:var(--orange);animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .hero p.lede{font-size:1.04rem;line-height:1.5;color:var(--ink);margin:14px 0 0;max-width:36ch}
  .scrawl{font-family:var(--font-hand);color:var(--pink);font-size:1.05rem}

  .swatch-card{width:262px;text-align:left}
  .swatch{display:block;width:100%;height:170px;overflow:visible}
  .build-media{position:relative;width:100%}
  .build-media img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;
    border:2.5px solid var(--line);border-radius:6px}
  .build-media .swatch{display:none}
  .build-media.noimg .swatch{display:block}
  .swatch-card .meta{margin-top:12px}
  .swatch-card h3{font-size:1.3rem}
  .swatch-card .blurb{font-size:.93rem;color:var(--ink-soft);margin:4px 0 0;line-height:1.4}
  .pill-link{display:inline-block;font-family:var(--font-hand);font-size:.9rem;text-decoration:none;
    color:var(--ink);background:var(--accent,var(--teal));border:2.5px solid var(--line);
    border-radius:40px;padding:5px 15px;box-shadow:3px 3px 0 var(--shadow);cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease}
  .pill-link:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--shadow)}
  .pill-link:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}

  .sticker{font-family:var(--font-hand);font-size:1rem;font-weight:700;color:var(--ink);
    background:var(--c,var(--sage));border:2.5px solid var(--line);border-radius:40px;
    padding:8px 16px;white-space:nowrap;box-shadow:4px 4px 0 var(--shadow)}

  /* ---------- polaroid photos ---------- */
  .polaroid{background:var(--paper);border:2.5px solid var(--line);padding:10px 10px 0;
    box-shadow:6px 7px 0 var(--shadow);width:var(--pw,220px);border-radius:6px;margin:0}
  .polaroid .ph{width:100%;aspect-ratio:var(--ar,4/3);overflow:hidden;border:2px solid var(--line);
    background:var(--phc,var(--cream-2));position:relative;display:flex;align-items:center;justify-content:center}
  .polaroid .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .polaroid .ph.noimg::after{content:attr(data-emoji);font-size:2.6rem;opacity:.9}
  .polaroid figcaption{font-family:var(--font-hand);font-size:.92rem;color:var(--ink);
    padding:9px 4px 13px;text-align:center;line-height:1.2}

  .contact{max-width:360px}
  .links{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
  .links a{font-family:var(--font-hand);text-decoration:none;color:var(--ink);
    border:2.5px solid var(--line);border-radius:40px;padding:6px 14px;
    box-shadow:3px 3px 0 var(--shadow);background:var(--paper);transition:transform .12s ease}
  .links a:hover{transform:translate(-1px,-1px) rotate(-2deg)}

  /* ---------- project story modal ---------- */
  .modal{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;
    background:rgba(44,38,32,.5);padding:20px;animation:fadein .2s ease}
  .modal[hidden]{display:none}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .modal-card{background:var(--paper);color:var(--ink);border:2.5px solid var(--line);
    border-radius:22px 8px 22px 8px/8px 22px 8px 22px;box-shadow:9px 10px 0 rgba(0,0,0,.28);
    max-width:540px;width:100%;max-height:86vh;overflow-y:auto;padding:30px 32px 32px;position:relative;
    animation:popin .22s cubic-bezier(.22,1.2,.36,1)}
  @keyframes popin{from{transform:scale(.94);opacity:.4}to{transform:scale(1);opacity:1}}
  .modal-x{position:absolute;top:14px;right:14px;background:var(--cream-2);border:2.5px solid var(--line);
    border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:.9rem;color:var(--ink);
    box-shadow:2px 2px 0 var(--shadow);line-height:1}
  .modal-x:hover{transform:translate(-1px,-1px)}
  .modal-card .mImg{width:100%;max-height:340px;object-fit:contain;background:var(--cream-2);
    border:2.5px solid var(--line);border-radius:12px;margin:2px 0 16px;display:block}
  .modal-card .mImg[hidden]{display:none}
  .modal-card h2{font-family:var(--font-hand);font-size:2rem;margin:8px 0 0;line-height:1.05;padding-right:34px}
  .modal-card .mTag{font-size:1.06rem;color:var(--ink);margin:12px 0 0;line-height:1.45;font-weight:700}
  .modal-card .mDetail{font-size:.98rem;color:var(--ink-soft);line-height:1.6;margin:14px 0 0}
  .modal-card .links{margin-top:18px}
  .gate-card{max-width:400px;text-align:center}
  .gate-card h2{padding-right:0;font-size:1.7rem;margin-top:6px}
  .gate-emoji{font-size:2.6rem;line-height:1}
  .gate-card .mDetail{margin-top:8px}
  .gate-input{font-family:var(--font-body);font-size:1.05rem;width:100%;margin-top:18px;
    padding:12px 16px;border:2.5px solid var(--line);border-radius:14px;background:var(--cream-2);
    color:var(--ink);text-align:center}
  .gate-input:focus{outline:3px dashed var(--pink);outline-offset:2px}
  .gate-err{color:var(--red);font-family:var(--font-hand);margin:10px 0 0}
  .gate-err[hidden]{display:none}
  .gate-go{margin-top:16px;background:var(--orange);font-size:1rem;padding:9px 22px}

  .blob{width:var(--w,120px);height:auto;overflow:visible}
  .bob{animation:bob 3.4s ease-in-out infinite}
  .bob.slow{animation-duration:4.6s}
  .bob.fast{animation-duration:2.6s}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9px) rotate(2deg)}}
  .spin{animation:spin 12s linear infinite;transform-origin:center}
  @keyframes spin{to{rotate:360deg}}
  .sway{animation:sway 4.8s ease-in-out infinite;transform-origin:bottom center}
  @keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  .drift{animation:drift 6s ease-in-out infinite}
  @keyframes drift{0%,100%{transform:translateX(0) rotate(0)}50%{transform:translateX(10px) rotate(1.5deg)}}
  .signpost{font-family:var(--font-hand);font-size:.85rem;color:var(--ink-soft);text-align:center}

  #dock{position:fixed;left:50%;bottom:18px;translate:-50% 0;z-index:200;display:flex;gap:8px;
    align-items:center;background:var(--paper);border:2.5px solid var(--line);border-radius:44px;
    padding:8px 10px;box-shadow:5px 6px 0 var(--shadow);max-width:calc(100vw - 24px);
    overflow-x:auto;scrollbar-width:none}
  #dock::-webkit-scrollbar{display:none}
  #dock button{font-family:var(--font-hand);font-size:.92rem;color:var(--ink);background:transparent;
    border:2px solid transparent;border-radius:30px;padding:6px 13px;cursor:pointer;
    white-space:nowrap;transition:background .15s}
  #dock button:hover{background:var(--cream-2)}
  #dock button.active{background:var(--orange);border-color:var(--line)}
  #dock .sep{width:2px;height:22px;background:var(--dot);border-radius:2px;flex:0 0 auto}
  #dock .icon{font-size:1rem;padding:6px 11px}
  :focus-visible{outline:3px dashed var(--pink);outline-offset:3px;border-radius:6px}

  #hint{position:fixed;top:16px;left:50%;translate:-50% 0;z-index:150;font-family:var(--font-hand);
    color:var(--ink-soft);font-size:.9rem;background:var(--paper);border:2px solid var(--line);
    border-radius:30px;padding:6px 15px;box-shadow:3px 3px 0 var(--shadow);
    display:flex;gap:8px;align-items:center;transition:opacity .5s}
  #hint .hand{animation:point 1.4s ease-in-out infinite}
  @keyframes point{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}

  #pre{position:fixed;inset:0;z-index:1000;background:var(--cream);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:22px;
    background-image:radial-gradient(var(--dot) 1.6px,transparent 1.6px);background-size:34px 34px;
    transition:opacity .6s ease}
  #pre.gone{opacity:0;pointer-events:none}
  #pre .pblob{width:150px;animation:bob 2.2s ease-in-out infinite}
  #pre .ptxt{font-family:var(--font-hand);color:var(--ink);font-size:1.15rem}
  #pre .bar{width:230px;height:20px;background:var(--paper);border:2.5px solid var(--line);
    border-radius:40px;overflow:hidden;box-shadow:3px 3px 0 var(--shadow)}
  #pre .fill{height:100%;width:0;background:repeating-linear-gradient(45deg,var(--orange) 0 12px,var(--red) 12px 24px);
    border-radius:40px;transition:width .2s linear}
  #pre .pct{font-family:var(--font-type);color:var(--ink-soft);font-size:.8rem}
  #pre .skip{position:absolute;bottom:22px;font-family:var(--font-hand);color:var(--ink-soft);
    background:none;border:none;cursor:pointer;font-size:.85rem;text-decoration:underline}

  @media (prefers-reduced-motion:reduce){*{animation:none!important}#board.flying{transition:transform .3s linear}}
  @media (max-width:560px){.card{max-width:290px}.hero{max-width:320px}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="9"/></filter>
  <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="6"/></filter>
</svg>

<!-- PRELOADER -->
<div id="pre">
  <svg class="pblob" viewBox="0 0 120 120" aria-hidden="true">
    <path d="M60 8c26 0 46 18 46 44 0 30-22 56-46 56S14 82 14 52C14 26 34 8 60 8Z" fill="#F49306" filter="url(#rough2)"/>
    <circle cx="45" cy="58" r="6" fill="#2C2620"/><circle cx="75" cy="58" r="6" fill="#2C2620"/>
    <circle cx="47" cy="56" r="2" fill="#fff"/><circle cx="77" cy="56" r="2" fill="#fff"/>
    <ellipse cx="38" cy="72" rx="7" ry="4" fill="#F13D09" opacity=".55"/>
    <ellipse cx="82" cy="72" rx="7" ry="4" fill="#F13D09" opacity=".55"/>
    <path d="M50 74c4 5 16 5 20 0" stroke="#2C2620" stroke-width="3" fill="none" stroke-linecap="round"/>
  </svg>
  <div class="ptxt">painting my little corner…</div>
  <div class="bar"><div class="fill" id="preFill"></div></div>
  <div class="pct" id="prePct">0%</div>
  <button class="skip" id="preSkip">skip →</button>
</div>

<div id="stage"><div id="board"></div></div>

<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal-card">
    <button class="modal-x" id="modalX" aria-label="close">✕</button>
    <img id="mImg" class="mImg" alt="" hidden>
    <p class="eyebrow" id="mSub"></p>
    <h2 id="mTitle"></h2>
    <p class="mTag" id="mTag"></p>
    <p class="mDetail" id="mDetail"></p>
    <div class="links" id="mLinks"></div>
  </div>
</div>

<div id="gate" class="modal" hidden role="dialog" aria-modal="true">
  <div class="modal-card gate-card">
    <div class="gate-emoji">🔒</div>
    <h2>psst… it's locked!</h2>
    <p class="mDetail">this little corner is password-protected. enter the password to explore the rest.</p>
    <input id="gateInput" class="gate-input" type="password" placeholder="password" autocomplete="off" aria-label="password">
    <p id="gateErr" class="gate-err" hidden>hmm, that's not it. try again!</p>
    <button id="gateGo" class="pill-link gate-go">let me in →</button>
  </div>
</div>

<div id="hint"><span class="hand">👆</span><span>drag anywhere to explore · pick up the cards & photos!</span></div>

<nav id="dock" aria-label="jump around">
  <button data-zone="home" class="active">✿ home</button>
  <button data-zone="about">about</button>
  <button data-zone="work">builds</button>
  <button data-zone="research">research</button>
  <button data-zone="awards">celebrations</button>
  <button data-zone="life">life</button>
  <button data-zone="teaching">teaching</button>
  <button data-zone="hi">say hi</button>
  <span class="sep"></span>
  <button class="icon" id="zoomOut" aria-label="zoom out">−</button>
  <button class="icon" id="zoomIn" aria-label="zoom in">+</button>
  <button class="icon" id="themeBtn" aria-label="toggle light or dark">☾</button>
</nav>

<script>
"use strict";
const board = document.getElementById('board');
const stage = document.getElementById('stage');
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ---------- helpers ---------- */
function node(x,y,rot,cls,html){
  const n=document.createElement('div');
  n.className='node '+(cls||'');
  n.style.left=x+'px'; n.style.top=y+'px';
  const t=document.createElement('div'); t.className='tilt'; t.style.setProperty('--r',(rot||0)+'deg');
  t.innerHTML=html; n.appendChild(t); board.appendChild(n);
  return n;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function cv(v){return v.startsWith('--')?`var(${v})`:v;}

function blobSVG(fill,blush,w,eyes){
  const eyeMk = eyes==='happy'
    ? `<path d="M40 56c3-4 9-4 12 0" stroke="#2C2620" stroke-width="3.5" fill="none" stroke-linecap="round"/>
       <path d="M68 56c3-4 9-4 12 0" stroke="#2C2620" stroke-width="3.5" fill="none" stroke-linecap="round"/>`
    : `<circle cx="46" cy="58" r="5.5" fill="#2C2620"/><circle cx="74" cy="58" r="5.5" fill="#2C2620"/>
       <circle cx="48" cy="56" r="1.8" fill="#fff"/><circle cx="76" cy="56" r="1.8" fill="#fff"/>`;
  return `<svg class="blob" style="--w:${w}px" viewBox="0 0 120 120" aria-hidden="true">
    <path d="M60 10c25 0 44 17 44 42 0 29-21 54-44 54S16 81 16 52C16 27 35 10 60 10Z" fill="${cv(fill)}" filter="url(#rough2)"/>
    ${eyeMk}
    <ellipse cx="38" cy="72" rx="6.5" ry="4" fill="${cv(blush)}" opacity=".5"/>
    <ellipse cx="82" cy="72" rx="6.5" ry="4" fill="${cv(blush)}" opacity=".5"/>
    <path d="M52 74c4 5 12 5 16 0" stroke="#2C2620" stroke-width="3" fill="none" stroke-linecap="round"/>
  </svg>`;
}
function starSVG(fill,w){
  return `<svg class="blob" style="--w:${w}px" viewBox="0 0 120 120" aria-hidden="true">
    <path d="M60 12l13 28 30 4-22 21 6 30-27-15-27 15 6-30-22-21 30-4z" fill="${cv(fill)}" filter="url(#rough2)"/>
    <circle cx="50" cy="60" r="4" fill="#2C2620"/><circle cx="70" cy="60" r="4" fill="#2C2620"/>
    <path d="M54 70c3 3 9 3 12 0" stroke="#2C2620" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  </svg>`;
}
/* ---------- crayon ocean critters ---------- */
function fishSVG(fill,w,flip){
  return `<svg class="blob" style="--w:${w}px" viewBox="0 0 140 100" aria-hidden="true">
    <g${flip?' transform="translate(140,0) scale(-1,1)"':''}>
      <path d="M108 50 L138 26 Q129 50 138 74 Z" fill="${cv(fill)}" filter="url(#rough2)"/>
      <path d="M54 22 Q72 4 92 26 Z" fill="${cv(fill)}" filter="url(#rough2)"/>
      <ellipse cx="68" cy="54" rx="48" ry="32" fill="${cv(fill)}" filter="url(#rough2)"/>
      <ellipse cx="60" cy="83" rx="12" ry="6" fill="${cv(fill)}" filter="url(#rough2)"/>
      <ellipse cx="30" cy="66" rx="7" ry="4" fill="var(--coral)" opacity=".45"/>
      <circle cx="45" cy="50" r="15" fill="#fff"/>
      <circle cx="42" cy="53" r="9" fill="#2C2620"/>
      <circle cx="39" cy="49" r="2.6" fill="#fff"/>
      <path d="M17 60 q8 6 16 1" stroke="#2C2620" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </g>
  </svg>`;
}
function seaweedSVG(fill,w){
  return `<svg class="blob" style="--w:${w}px" viewBox="0 0 70 150" aria-hidden="true">
    <path d="M26 149 C6 121 44 105 22 75 C4 47 38 35 24 7" stroke="${cv(fill)}" stroke-width="11" fill="none" stroke-linecap="round" filter="url(#rough2)"/>
    <path d="M46 149 C36 123 64 107 46 79 C34 55 58 41 48 17" stroke="${cv(fill)}" stroke-width="8" fill="none" stroke-linecap="round" filter="url(#rough2)"/>
  </svg>`;
}
function bubblesSVG(fill,w){
  return `<svg class="blob" style="--w:${w}px" viewBox="0 0 80 120" aria-hidden="true">
    <circle cx="30" cy="98" r="12" fill="none" stroke="${cv(fill)}" stroke-width="4" filter="url(#rough2)"/>
    <circle cx="52" cy="64" r="8" fill="none" stroke="${cv(fill)}" stroke-width="3.5" filter="url(#rough2)"/>
    <circle cx="34" cy="34" r="6" fill="none" stroke="${cv(fill)}" stroke-width="3" filter="url(#rough2)"/>
    <circle cx="50" cy="12" r="4" fill="none" stroke="${cv(fill)}" stroke-width="2.6" filter="url(#rough2)"/>
  </svg>`;
}
/* ---------- crayon woods critters ---------- */
function bearSVG(w){
  return `<svg class="blob" style="--w:${w}px" viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="30" cy="32" r="17" fill="#C6894B" filter="url(#rough2)"/>
    <circle cx="90" cy="32" r="17" fill="#C6894B" filter="url(#rough2)"/>
    <circle cx="30" cy="32" r="8" fill="#8A5A2B"/><circle cx="90" cy="32" r="8" fill="#8A5A2B"/>
    <ellipse cx="60" cy="68" rx="45" ry="41" fill="#C6894B" filter="url(#rough2)"/>
    <ellipse cx="60" cy="84" rx="24" ry="17" fill="#E4C79A" filter="url(#rough2)"/>

/* ===================== PAN / ZOOM ===================== */
let tx=0, ty=0, scale=1;
const MINS=0.25, MAXS=1.4;
function apply(){ board.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`; }
function vpW(){ return window.innerWidth || document.documentElement.clientWidth || 1024; }
function vpH(){ return window.innerHeight || document.documentElement.clientHeight || 768; }
function centerOn(zx,zy,animate,vs){
  var w = vpW(), h = vpH();
  if(vs){
    var mul = w < 620 ? 0.62 : w < 1000 ? 0.82 : 1;
    scale = Math.min(MAXS, Math.max(MINS, vs*mul));
  }
  tx = w/2 - zx*scale; ty = h/2 - zy*scale;
  if(animate){ board.classList.add('flying'); clearTimeout(centerOn._t);
    centerOn._t=setTimeout(()=>board.classList.remove('flying'),900); }
  apply();
}
function zoomBy(factor){
  if(locked){ openGate(); return; }
  userMoved=true;
  const wx=(innerWidth/2 - tx)/scale, wy=(innerHeight/2 - ty)/scale;
  scale=Math.min(MAXS,Math.max(MINS, scale*factor));
  tx=innerWidth/2 - wx*scale; ty=innerHeight/2 - wy*scale;
  board.classList.add('flying'); clearTimeout(zoomBy._t);
  zoomBy._t=setTimeout(()=>board.classList.remove('flying'),300);
  apply();
}
document.getElementById('zoomIn').onclick=()=>zoomBy(1.18);
document.getElementById('zoomOut').onclick=()=>zoomBy(1/1.18);

const zoneBtns=[...document.querySelectorAll('#dock [data-zone]')];
zoneBtns.forEach(b=>b.onclick=()=>{
  const z=ZONES[b.dataset.zone]; if(!z) return;
  if(locked && b.dataset.zone!=='home'){ openGate(); return; }
  userMoved=true; centerOn(z[0],z[1],true, VIEW[b.dataset.zone]||0.9);
  zoneBtns.forEach(x=>x.classList.toggle('active',x===b));
});

/* ===================== DRAG (pan + cards/photos) ===================== */
let mode=null, curCard=null, moved=false;
let start={x:0,y:0}, base={x:0,y:0};
function onDown(e){
  if(e.button===1||e.button===2) return;
  moved=false;
  if(e.target.closest('[data-nodrag]')) return;
  const cardNode=e.target.closest('.draggable');
  if(locked){ openGate(); return; }
  userMoved=true;
  start.x=e.clientX; start.y=e.clientY;
  if(cardNode){
    mode='card'; curCard=cardNode;
    base.x=parseFloat(cardNode.style.left); base.y=parseFloat(cardNode.style.top);
    cardNode.classList.add('dragging');
  } else { mode='pan'; base.x=tx; base.y=ty; stage.classList.add('grabbing'); }
  board.classList.remove('flying');
  window.addEventListener('pointermove',onMove);
  window.addEventListener('pointerup',onUp);
  e.preventDefault();
}
function onMove(e){
  const dx=e.clientX-start.x, dy=e.clientY-start.y;
  if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
  if(mode==='pan'){ tx=base.x+dx; ty=base.y+dy; apply(); }
  else if(mode==='card' && curCard){
    curCard.style.left=(base.x+dx/scale)+'px';
    curCard.style.top =(base.y+dy/scale)+'px';
  }
  hideHint();
}
function onUp(){
  if(curCard) curCard.classList.remove('dragging');
  stage.classList.remove('grabbing'); mode=null; curCard=null;
  window.removeEventListener('pointermove',onMove);
  window.removeEventListener('pointerup',onUp);
}
stage.addEventListener('pointerdown',onDown);
board.addEventListener('click',e=>{ if(moved){ const a=e.target.closest('a'); if(a) e.preventDefault(); } },true);
stage.addEventListener('wheel',e=>{
  e.preventDefault();
  if(locked){ openGate(); return; }
  if(e.ctrlKey){ zoomBy(e.deltaY<0?1.08:1/1.08); return; }
  tx-=e.deltaX; ty-=e.deltaY; apply();
},{passive:false});

function openGate(){ if(!locked || !gate.hidden) return; gate.hidden=false; gateErr.hidden=true; setTimeout(()=>gateInput.focus(),40); }
function closeGate(){ gate.hidden=true; }
function tryUnlock(){
  if(gateInput.value.trim().toLowerCase()==='idk'){
    locked=false; try{ sessionStorage.setItem('jc_unlocked','1'); }catch(e){}
    gate.hidden=true; gateInput.value='';
    hint.innerHTML='<span class="hand">👆</span><span>you’re in! drag anywhere to explore ♡</span>';
    hint.onclick=null; hint.style.cursor=''; hint.style.opacity='1';
    clearTimeout(hintTimer); hintTimer=setTimeout(hideHint,4200);
  } else { gateErr.hidden=false; gateInput.select(); }
}

(function(){
  const fill=document.getElementById('preFill'), pct=document.getElementById('prePct'), pre=document.getElementById('pre');
  let p=0; const step=reduce?100:4, dur=reduce?300:1700;
  const iv=setInterval(()=>{
    p=Math.min(100,p+step+Math.round(Math.random()*3));
    fill.style.width=p+'%'; pct.textContent=p+'%';
    if(p>=100){ clearInterval(iv); setTimeout(done,260); }
  }, dur/(100/step));
  function done(){ pre.classList.add('gone'); setTimeout(()=>pre&&pre.remove(),650); }
  document.getElementById('preSkip').onclick=()=>{ clearInterval(iv); done(); };
})();
